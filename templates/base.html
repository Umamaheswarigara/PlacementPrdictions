<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <title>{% block title %}ML Placement{% endblock %}</title>
</head>

<body>

<div class="wrapper">

    <!-- Left Menu -->
    <aside class="sidebar">
        <h2>ML Pipeline</h2>

        <a href="{{ url_for('home') }}">
            HOME
        </a>

        <br>

        <a href="{{ url_for('upload') }}">
            UPLOAD DATA
        </a>
        <br>
        <a href="{{ url_for('eda') }}">
            <i class="bi bi-house"></i>
            Visuilize data
        </a>
    </aside>

    <!-- Right Content -->
    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

</div>

</body>
</html>
